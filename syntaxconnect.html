<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SyntaxConnect | Coming soon</title>
<meta name="description" content="SyntaxConnect designs and builds websites and apps. Our full website is coming soon.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="SyntaxConnect">
<meta property="og:title" content="SyntaxConnect | Coming soon">
<meta property="og:description" content="SyntaxConnect designs and builds websites and apps. Our full website is coming soon.">
<meta name="theme-color" content="#0f1720">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='22' fill='%230f1720'/%3E%3Ctext x='50' y='66' text-anchor='middle' font-size='46' font-family='monospace' font-weight='700' fill='%2338bdf8'%3E%3C/%3E%3C/text%3E%3C/svg%3E">
<style>
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    min-height:100%;display:flex;flex-direction:column;
    background:#0f1720;color:#e6edf3;
    font-family:system-ui,-apple-system,"Segoe UI",Roboto,Inter,sans-serif;
  }
  main{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 24px}
  .card{max-width:620px;width:100%}
  .mark{display:flex;align-items:center;justify-content:center;width:64px;height:64px;border-radius:16px;
        background:#16222e;border:1px solid #2a3a4a;color:#38bdf8;font:700 26px ui-monospace,SFMono-Regular,Consolas,monospace;margin-bottom:28px}
  .status{display:inline-flex;align-items:center;gap:8px;font-size:14px;font-weight:600;color:#a7f3d0;
          background:rgba(52,211,153,.1);border:1px solid rgba(52,211,153,.35);border-radius:999px;padding:6px 14px;margin:0 0 20px}
  .dot{width:8px;height:8px;border-radius:50%;background:#34d399;animation:pulse 1.8s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  @media (prefers-reduced-motion:reduce){.dot{animation:none}}
  h1{margin:0 0 14px;font-size:clamp(40px,8vw,64px);line-height:1.02;letter-spacing:-.02em}
  h1 span{color:#38bdf8}
  .lead{margin:0 0 32px;font-size:19px;line-height:1.6;color:#b8c4d0}
  h2{margin:0 0 12px;font-size:14px;text-transform:uppercase;letter-spacing:.1em;color:#8b9bab}
  .work{display:flex;align-items:center;justify-content:space-between;gap:16px;text-decoration:none;color:inherit;
        background:#16222e;border:1px solid #2a3a4a;border-radius:14px;padding:18px 20px;
        transition:border-color .18s ease,transform .12s ease}
  .work:hover{border-color:#38bdf8}
  .work:active{transform:scale(.99)}
  .work:focus-visible{outline:3px solid #38bdf8;outline-offset:3px}
  .work strong{display:block;font-size:18px;margin-bottom:2px}
  .work small{color:#b8c4d0;font-size:15px}
  .arrow{color:#38bdf8;flex:none}
  footer{padding:24px;text-align:center;color:#8b9bab;font-size:14px}
</style>
</head>
<body>
<main>
  <div class="card">
    <div class="mark" aria-hidden="true">&lt;/&gt;</div>
    <p class="status"><span class="dot" aria-hidden="true"></span>Website under development</p>
    <h1>Syntax<span>Connect</span></h1>
    <p class="lead">We design and build websites and apps. Our full website is coming soon.</p>

    <h2>Our work</h2>
    <a class="work" href="index.html">
      <span><strong>YAZI</strong><small>Helping learners find their options after matric</small></span>
      <svg class="arrow" aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </a>
  </div>
</main>
<footer>&copy; <span id="year"></span> SyntaxConnect</footer>
<script>document.getElementById("year").textContent=new Date().getFullYear()</script>
</body>
</html>
